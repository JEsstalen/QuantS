// ── radar chart ──────────────────────────────────────────────────────────────
function drawRadar(canvasId, dims) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const dpr = devicePixelRatio || 1;
  const W = Math.min(c.parentElement.clientWidth - 20, 320);
  const H = 220;
  c.width = W*dpr; c.height = H*dpr;
  c.style.width = W+'px'; c.style.height = H+'px';
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);

  const cx = W / 2, cy = H / 2;
  const radius = Math.min(W, H) / 2 - 30;
  const n = dims.length;

  // grid rings: 25 / 50 / 75 / 100
  ctx.strokeStyle = '#e4e7ec'; ctx.lineWidth = 1;
  [0.25, 0.5, 0.75, 1].forEach(scale => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = -Math.PI/2 + i * 2 * Math.PI / n;
      const x = cx + Math.cos(angle) * radius * scale;
      const y = cy + Math.sin(angle) * radius * scale;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  });
  // axes
  ctx.strokeStyle = '#e4e7ec';
  for (let i = 0; i < n; i++) {
    const angle = -Math.PI/2 + i * 2 * Math.PI / n;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
    ctx.stroke();
  }
  // labels
  ctx.fillStyle = '#6b7280'; ctx.font = '600 11px system-ui';
  for (let i = 0; i < n; i++) {
    const angle = -Math.PI/2 + i * 2 * Math.PI / n;
    const x = cx + Math.cos(angle) * (radius + 16);
    const y = cy + Math.sin(angle) * (radius + 16);
    ctx.textAlign = Math.abs(Math.cos(angle)) < 0.1 ? 'center'
                  : Math.cos(angle) > 0 ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(dims[i][0], x, y);
  }
  // polygon
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const angle = -Math.PI/2 + i * 2 * Math.PI / n;
    const v = (dims[i][1] || 0) / 100;
    const x = cx + Math.cos(angle) * radius * v;
    const y = cy + Math.sin(angle) * radius * v;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(37,99,235,.18)';
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 2;
  ctx.fill(); ctx.stroke();
  // points
  for (let i = 0; i < n; i++) {
    const angle = -Math.PI/2 + i * 2 * Math.PI / n;
    const v = (dims[i][1] || 0) / 100;
    const x = cx + Math.cos(angle) * radius * v;
    const y = cy + Math.sin(angle) * radius * v;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fillStyle = '#2563eb'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    // numeric labels
    ctx.fillStyle = '#111827'; ctx.font = '700 10px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lx = cx + Math.cos(angle) * radius * v * 0.7;
    const ly = cy + Math.sin(angle) * radius * v * 0.7;
    // skip middle labels if too crowded (only first/last)
  }
}

// ── chart ─────────────────────────────────────────────────────────────────────
function drawChart(id, prices, loader) {
  if(!prices?.length){loader?.classList.remove('show');return;}
  const canvas=document.getElementById(id);
  if(!canvas) return;
  const dpr=devicePixelRatio||1, W=canvas.parentElement.clientWidth-24, H=155;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const closes=prices.map(p=>p.close);
  const mn=Math.min(...closes),mx=Math.max(...closes),rng=mx-mn||1;
  const pL=8,pR=48,pT=8,pB=20,cW=W-pL-pR,cH=H-pT-pB;
  const xf=i=>pL+i/(closes.length-1||1)*cW, yf=v=>pT+(1-(v-mn)/rng)*cH;
  ctx.strokeStyle='#e9ebee';ctx.lineWidth=.5;
  for(let i=0;i<=3;i++){
    const y=pT+i/3*cH;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(pL+cW,y);ctx.stroke();
    ctx.fillStyle='#9ca3af';ctx.font='9px system-ui';ctx.textAlign='left';
    ctx.fillText('$'+(mx-(mx-mn)*i/3).toFixed(0),pL+cW+4,y+3);
  }
  const up=closes[closes.length-1]>=closes[0], lc=up?'#16a34a':'#dc2626';
  const grad=ctx.createLinearGradient(0,pT,0,pT+cH);
  grad.addColorStop(0,up?'rgba(22,163,74,.13)':'rgba(220,38,38,.13)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.moveTo(xf(0),yf(closes[0]));
  for(let i=1;i<closes.length;i++) ctx.lineTo(xf(i),yf(closes[i]));
  ctx.lineTo(xf(closes.length-1),pT+cH);ctx.lineTo(xf(0),pT+cH);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(xf(0),yf(closes[0]));
  for(let i=1;i<closes.length;i++) ctx.lineTo(xf(i),yf(closes[i]));
  ctx.strokeStyle=lc;ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#9ca3af';ctx.font='9px system-ui';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(prices.length/5));
  for(let i=0;i<prices.length;i+=step) ctx.fillText(prices[i].date.slice(0,7),xf(i),H-4);
  loader?.classList.remove('show');
}

function renderRRG(data, toolbar) {

    leading:    {color:'#16a34a', bg:'rgba(22,163,74,.10)', label:'领涨', desc:'相对强 + 仍在加速'},
    weakening:  {color:'#d97706', bg:'rgba(217,119,6,.10)', label:'走弱', desc:'相对强但动能减退'},
    lagging:    {color:'#dc2626', bg:'rgba(220,38,38,.10)', label:'落后', desc:'相对弱 + 还在下滑'},
    improving:  {color:'#2563eb', bg:'rgba(37,99,235,.10)', label:'改善', desc:'相对弱但动能恢复'},
  };
  const grouped = {leading:[], weakening:[], lagging:[], improving:[]};

  html += '<div class="rrg-canvas-wrap"><canvas id="rrgCanvas"></canvas></div>';
  html += '<div class="rrg-side">';
  ['leading','improving','weakening','lagging'].forEach(q => {

      <div class="rrg-quad-head">
        <span style="color:${info.color};font-weight:800">${info.label}</span>

    </div>`;
  });
  html += '</div></div>';

}

function drawRRG(sectors, quadInfo) {
  const c = document.getElementById('rrgCanvas');
  if (!c) return;
  const dpr = devicePixelRatio || 1;
  const W = c.parentElement.clientWidth, H = Math.min(W * 0.85, 520);
  c.width = W*dpr; c.height = H*dpr;
  c.style.width = W+'px'; c.style.height = H+'px';
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);

  // 自适应范围：以 100 为中心，根据数据扩张
  const allX = sectors.flatMap(s => s.rrg_tail_x || [s.rrg_x]);
  const allY = sectors.flatMap(s => s.rrg_tail_y || [s.rrg_y]);
  const xR = Math.max(3, ...allX.map(v=>Math.abs(v-100)));
  const yR = Math.max(3, ...allY.map(v=>Math.abs(v-100)));
  const xMin = 100-xR*1.1, xMax = 100+xR*1.1;
  const yMin = 100-yR*1.1, yMax = 100+yR*1.1;
  const pad = 36;
  const cW = W - pad*2, cH = H - pad*2;
  const xf = v => pad + (v-xMin)/(xMax-xMin) * cW;
  const yf = v => pad + (1-(v-yMin)/(yMax-yMin)) * cH;

  // 象限背景填色
  ctx.fillStyle = 'rgba(22,163,74,.05)';   ctx.fillRect(xf(100), yf(yMax), xf(xMax)-xf(100), yf(100)-yf(yMax));   // 领涨 右上
  ctx.fillStyle = 'rgba(37,99,235,.05)';   ctx.fillRect(xf(xMin), yf(yMax), xf(100)-xf(xMin), yf(100)-yf(yMax)); // 改善 左上
  ctx.fillStyle = 'rgba(220,38,38,.05)';   ctx.fillRect(xf(xMin), yf(100), xf(100)-xf(xMin), yf(yMin)-yf(100));  // 落后 左下
  ctx.fillStyle = 'rgba(217,119,6,.05)';   ctx.fillRect(xf(100), yf(100), xf(xMax)-xf(100), yf(yMin)-yf(100));   // 走弱 右下

  // 中心十字
  ctx.strokeStyle = '#9ca3af'; ctx.setLineDash([3,3]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(xf(100), pad); ctx.lineTo(xf(100), pad+cH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, yf(100)); ctx.lineTo(pad+cW, yf(100)); ctx.stroke();
  ctx.setLineDash([]);

  // 象限标签
  ctx.font = 'bold 12px system-ui'; ctx.fillStyle = '#16a34a'; ctx.textAlign = 'right';
  ctx.fillText('领涨 ↗', pad+cW-6, pad+14);
  ctx.fillStyle = '#2563eb'; ctx.textAlign = 'left';
  ctx.fillText('↖ 改善', pad+6, pad+14);
  ctx.fillStyle = '#dc2626';
  ctx.fillText('↙ 落后', pad+6, pad+cH-6);
  ctx.fillStyle = '#d97706'; ctx.textAlign = 'right';
  ctx.fillText('走弱 ↘', pad+cW-6, pad+cH-6);

  // 轴标签
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('相对 SPY 强度 →', xf(100), H-6);
  ctx.save(); ctx.translate(12, yf(100)); ctx.rotate(-Math.PI/2);
  ctx.fillText('强度动量 →', 0, 0); ctx.restore();

  // 画每只ETF：尾巴+当前点+标签
  sectors.forEach(s => {
    const xs = s.rrg_tail_x || [s.rrg_x];
    const ys = s.rrg_tail_y || [s.rrg_y];
    const q = s.rrg_quadrant || 'lagging';
    const color = quadInfo[q]?.color || '#9ca3af';
    // 尾巴
    if (xs.length > 1) {
      ctx.beginPath();
      xs.forEach((x,i) => {
        const X = xf(x), Y = yf(ys[i]);
        if (i===0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      });
      ctx.strokeStyle = color; ctx.globalAlpha = 0.35; ctx.lineWidth = 1.5;
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    // 当前点
    const cx = xf(s.rrg_x), cy = yf(s.rrg_y);
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    // ticker 标签
    ctx.font = '600 10px system-ui'; ctx.fillStyle = '#111827';
    ctx.textAlign = 'left';
    ctx.fillText(s.ticker, cx+9, cy+3);
  });
}

function drawCompactSpark(c, values) {
  if (!values?.length) return;
  const dpr = devicePixelRatio || 1;
  const W = 120, H = 28;
  c.width = W*dpr; c.height = H*dpr;
  c.style.width = W+'px'; c.style.height = H+'px';
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  // 累计净值
  const cum = [1];
  values.forEach(v => cum.push(cum[cum.length-1] * (1 + (v||0)/100)));
  const mn = Math.min(...cum), mx = Math.max(...cum), rng = mx-mn||1;
  const xf = i => i/(cum.length-1) * (W-4) + 2;
  const yf = v => H - 2 - (v-mn)/rng * (H-4);
  const up = cum[cum.length-1] >= cum[0];
  ctx.beginPath();
  cum.forEach((v,i)=>i===0?ctx.moveTo(xf(i),yf(v)):ctx.lineTo(xf(i),yf(v)));
  ctx.strokeStyle = up ? '#16a34a' : '#dc2626';
  ctx.lineWidth = 1.5; ctx.stroke();
}

let _heatmapViewMode = 'grid'; // 'grid' | 'rrg' | 'compact'
function setHeatmapMode(m) {
  _heatmapViewMode = m;
  if (_heatmapCache[currentHeatmapKind]) renderSectorHeatmap(_heatmapCache[currentHeatmapKind]);
}

function renderSectorHeatmap(data) {
  const { sectors, dates } = data;
  const wrap = document.getElementById('sectorHeatmapWrap');

  // dates 倒序：最新在最上
  const datesRev = dates.slice().reverse();

  // phase label map
  const PHASE = {
    accel_up:    {cls:'pb-accel-up',    txt:'加速↑'},
    reversal_up: {cls:'pb-reversal-up', txt:'反转↑'},
    cooling:     {cls:'pb-cooling',     txt:'减速'},
    topping:     {cls:'pb-topping',     txt:'见顶↓'},
    accel_dn:    {cls:'pb-accel-dn',    txt:'加速↓'},
    stabilizing: {cls:'pb-stabilizing', txt:'企稳'},
    neutral:     {cls:'pb-neutral',     txt:'—'},
  };

  const modeLabels = {grid:'日历热力', rrg:'轮动象限', compact:'紧凑模式'};
  let h = '<div class="heatmap-toolbar">';
  h += `<span style="font-weight:700;font-size:12px">${currentHeatmapKind==='themes'?'细分概念':'板块'}视图</span>`;
  h += '<div class="kind-tabs">';
  h += `<button class="${currentHeatmapKind==='sectors'?'active':''}" onclick="switchHeatmapKind('sectors')">11大板块</button>`;
  h += `<button class="${currentHeatmapKind==='themes'?'active':''}" onclick="switchHeatmapKind('themes')">细分概念</button>`;
  h += '</div>';
  h += '<div class="kind-tabs">';
  ['grid','rrg','compact'].forEach(m=>{
    h += `<button class="${_heatmapViewMode===m?'active':''}" onclick="setHeatmapMode('${m}')">${modeLabels[m]}</button>`;
  });
  h += '</div>';
  const desc = _heatmapViewMode==='rrg' ? '相对 SPY 的轮动象限 · 拖尾=最近8周轨迹'
             : _heatmapViewMode==='compact' ? '每个板块一行：阶段标签+趋势+迷你走势'
             : '按近5日收益排序 · 颜色饱和点±2.5%';
  h += `<span style="color:var(--text3);font-size:11px">${desc}</span>`;
  h += '</div>';

  if (_heatmapViewMode === 'rrg') {
    renderRRG(data, h); return;
  }
  if (_heatmapViewMode === 'compact') {
    renderCompact(data, h); return;
  }

  h += '<div class="heatmap-wrap" style="overflow:auto;max-height:calc(100vh - 220px)">';
  h += '<table class="heatmap-table"><thead><tr>';
  h += '<th class="date-col">日期</th>';
  sectors.forEach(s => { h += `<th>${s.name}<span class="sec-ticker">${s.ticker}</span></th>`; });
  h += '</tr></thead><tbody>';

  // phase row（首先显示，最直观）
  h += '<tr class="phase-row"><td class="date-col">热度阶段</td>';
  sectors.forEach(s => {
    const p = PHASE[s.phase] || PHASE.neutral;
    const acc = s.accel != null ? `<div style="font-size:9px;color:var(--text3);font-weight:400;margin-top:2px">Δ${s.accel>0?'+':''}${s.accel}</div>` : '';
    h += `<td title="近5日动能减去前5日动能">
      <span class="phase-badge ${p.cls}">${p.txt}</span>
      ${acc}
    </td>`;
  });
  h += '</tr>';

  // trend summary rows
  [['近5日','cum5',1],['近20日','cum20',1],['近60日','cum60',1]].forEach(([label,key,dec])=>{
    h += `<tr class="trend-row"><td class="date-col" style="color:var(--text);font-weight:700">${label}</td>`;
    sectors.forEach(s=>{
      const v = s[key];
      h += `<td class="heat-cell" style="background:${heatBg(v)};color:${heatFg(v)}">${heatFmt(v,dec)}</td>`;
    });
    h += '</tr>';
  });

  // 分隔
  h += `<tr><td colspan="${sectors.length+1}" style="height:5px;background:var(--surface2);padding:0;border:none"></td></tr>`;

  // daily rows: 最新在最上（dates 倒序）
  datesRev.forEach((date, ri) => {
    const di = dates.length - 1 - ri;  // 反推原始 index
    const isLatest = ri === 0;
    h += `<tr><td class="date-col" ${isLatest?'style="color:var(--accent);font-weight:700"':''}>${date.slice(5)}${isLatest?' ●':''}</td>`;
    sectors.forEach(s => {
      const v = s.returns[di];
      const title = `${date}  ${s.name}: ${heatFmt(v,2)}`;
      h += `<td class="heat-cell" style="background:${heatBg(v)};color:${heatFg(v)}" title="${title}">${heatFmt(v,2)}</td>`;
    });
    h += '</tr>';
  });

  h += '</tbody></table></div>';
  wrap.innerHTML = h;
}

let currentHeatmapKind = 'sectors';
let _heatmapCache = { sectors: null, themes: null };

function switchHeatmapKind(kind) {
  if (kind === currentHeatmapKind) return;
  currentHeatmapKind = kind;
  if (_heatmapCache[kind]) {
    renderSectorHeatmap(_heatmapCache[kind]);
  } else {
    loadSectorHeatmap();
  }
}

async function loadSectorHeatmap(force = false) {
  sectorsLoaded = true;
  const kind = currentHeatmapKind;
  const wrap = document.getElementById('sectorHeatmapWrap');
  const dot  = document.getElementById('sectorDot');
  const stat = document.getElementById('sectorStatus');

  if (!force && _heatmapCache[kind]) { renderSectorHeatmap(_heatmapCache[kind]); return; }

  dot.className = 'status-dot running';
  stat.textContent = '获取数据…';
  wrap.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>获取中…</p></div>';

  try {
    const resp = await fetch('/api/sectors/heatmap?kind=' + kind + (force ? '&_=' + Date.now() : ''));
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    _heatmapCache[kind] = data;
    renderSectorHeatmap(data);
    dot.className = 'status-dot done';
    const now = new Date();
    document.getElementById('sectorTs').textContent =
      `更新于 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    stat.textContent = `${data.sectors.length} 个 · 近60交易日`;
  } catch (e) {
    dot.className = 'status-dot error';
    stat.textContent = '加载失败：' + e.message;
    wrap.innerHTML = `<div class="empty-state"><p style="color:var(--red)">加载失败：${esc(e.message)}</p></div>`;
  }
}

// ── watchlist (localStorage-backed) ──────────────────────────────────────────
const WL_KEY = 'momentum_watchlist_v1';
function loadWL() {
  try { return JSON.parse(localStorage.getItem(WL_KEY) || '[]'); } catch(_) { return []; }
}
function saveWL(list) {
  try { localStorage.setItem(WL_KEY, JSON.stringify(list)); } catch(_){}
  updateWLBadge();
}
function updateWLBadge() {
  const list = loadWL();
  const el = document.getElementById('wlCount');
  if (!el) return;
  if (list.length) {
    el.style.display = 'inline-block';
    el.textContent = list.length;
  } else el.style.display = 'none';
}
function addToWatchlist(ticker, name, sector, entry, stop, target) {
  const list = loadWL();
  if (list.some(w => w.ticker === ticker)) {
    alert(ticker + ' 已在自选');
    return;
  }
  list.push({
    ticker, name: name||'', sector: sector||'',
    entry: parseFloat(entry), stop: parseFloat(stop)||null,
    target: parseFloat(target)||null,
    added: new Date().toISOString().slice(0,10),
  });
  saveWL(list);
  alert('已加入自选');
}
function removeWatch(ticker) {
  if (!confirm('确定从自选移除 ' + ticker + '?')) return;
  saveWL(loadWL().filter(w => w.ticker !== ticker));
  renderWatchlist();
}

async function fetchCurrentPrice(ticker) {
  try {
    const d = await (await fetch('/api/detail/' + ticker + '?months=1')).json();
    const last = d.prices && d.prices.length ? d.prices[d.prices.length-1].close : null;
    return last;
  } catch(_) { return null; }
}

async function renderWatchlist() {
  const list = loadWL();
  const panel = document.getElementById('watchlistPanel');
  updateWLBadge();

  let formHtml = `
    <div class="wl-add-form">
      <div><label>股票代码</label><input id="wlTk" placeholder="NVDA" maxlength="8"></div>
      <div><label>买入价</label><input id="wlEntry" type="number" step="0.01" placeholder="123.45"></div>
      <div><label>止损位</label><input id="wlStop" type="number" step="0.01" placeholder="115.00"></div>
      <div><label>目标价</label><input id="wlTgt" type="number" step="0.01" placeholder="145.00"></div>
      <div><label>买入日期</label><input id="wlDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <button class="wl-add-btn" onclick="wlAddManual()">+ 添加</button>
    </div>`;

  if (!list.length) {
    panel.innerHTML = formHtml + `
      <div class="wl-empty">
        <div style="font-size:48px;opacity:.2">📌</div>
        <p style="margin-top:10px">自选列表为空</p>
        <small>从策略表点击股票详情页 → 「加入自选」，或上方手动添加</small>
      </div>`;
    return;
  }

  panel.innerHTML = formHtml + `
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:20px;color:var(--text3)">
      <div class="spinner"></div><span>拉取最新价格…</span>
    </div>`;

  // 并发拉所有当前价
  const prices = await Promise.all(list.map(w => fetchCurrentPrice(w.ticker)));

  let rows = '';
  list.forEach((w, i) => {
    const cur = prices[i];
    if (cur == null) {
      rows += `<tr><td><b>${esc(w.ticker)}</b></td><td colspan="6" style="color:var(--text3)">未能获取当前价</td><td><button class="wl-del" onclick="removeWatch('${esc(w.ticker)}')">✕</button></td></tr>`;
      return;
    }
    const pnl = ((cur - w.entry) / w.entry) * 100;
    const pnlC = pnl >= 0 ? 'pos' : 'neg';

    // 距止损 / 目标
    let progHtml = '<span style="color:var(--text3)">—</span>';
    if (w.stop != null && w.target != null && w.stop < w.target) {
      const span = w.target - w.stop;
      const nowPos = Math.max(0, Math.min(100, ((cur - w.stop) / span) * 100));
      progHtml = `<div class="wl-prog">
        <div class="wl-prog-stop" style="width:${nowPos*0.5}%"></div>
        <div class="wl-prog-tgt"  style="left:${nowPos}%;width:${100-nowPos}%"></div>
        <div class="wl-prog-now"  style="left:calc(${nowPos}% - 1px)"></div>
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:3px;display:flex;justify-content:space-between">
        <span>止损 $${w.stop}</span><span>目标 $${w.target}</span>
      </div>`;
    }

    const stopDist  = w.stop  != null ? ((cur - w.stop)  / cur * 100).toFixed(1) : null;
    const tgtDist   = w.target!= null ? ((w.target - cur) / cur * 100).toFixed(1) : null;
    const stopWarn  = stopDist != null && parseFloat(stopDist) < 2;
    const tgtClose  = tgtDist != null && parseFloat(tgtDist) < 5;

    rows += `<tr>
      <td>
        <div style="font-weight:700;cursor:pointer;color:var(--accent)" onclick="loadDetail('${esc(w.ticker)}')">${esc(w.ticker)}</div>
        <div style="font-size:10px;color:var(--text3)">${esc(w.sector||'')}</div>
      </td>
      <td style="font-variant-numeric:tabular-nums">$${w.entry}</td>
      <td style="font-variant-numeric:tabular-nums">$${cur.toFixed(2)}</td>
      <td><span class="wl-pnl ${pnlC}">${pnl>0?'+':''}${pnl.toFixed(2)}%</span></td>
      <td style="min-width:140px">${progHtml}</td>
      <td><span class="${stopWarn?'neg':'neu'}" style="font-weight:${stopWarn?'700':'400'}">${stopDist!=null?stopDist+'%':'—'}</span></td>
      <td><span class="${tgtClose?'pos':'neu'}" style="font-weight:${tgtClose?'700':'400'}">${tgtDist!=null?tgtDist+'%':'—'}</span></td>
      <td style="color:var(--text3);font-size:11px">${esc(w.added)}</td>
      <td><button class="wl-del" onclick="removeWatch('${esc(w.ticker)}')">✕</button></td>
    </tr>`;
  });

  panel.innerHTML = formHtml + `
    <table class="wl-table">
      <thead><tr>
        <th>股票</th><th>买入价</th><th>当前价</th><th>盈亏%</th>
        <th>位置</th><th>距止损</th><th>距目标</th><th>加入</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="font-size:11px;color:var(--text3);margin-top:10px">
      💡 距止损 &lt; 2% 红色加粗 — 考虑减仓或上调止损 · 距目标 &lt; 5% 绿色加粗 — 考虑分批止盈
    </div>`;
}

function wlAddManual() {
  const tk = document.getElementById('wlTk').value.trim().toUpperCase();
  const e  = document.getElementById('wlEntry').value;
  const s  = document.getElementById('wlStop').value;
  const t  = document.getElementById('wlTgt').value;
  const d  = document.getElementById('wlDate').value;
  if (!tk || !e) { alert('股票代码和买入价必填'); return; }
  const list = loadWL();
  if (list.some(w => w.ticker === tk)) { alert(tk + ' 已在自选'); return; }
  list.push({
    ticker: tk, name:'', sector:'',
    entry: parseFloat(e),
    stop:  s ? parseFloat(s) : null,
    target:t ? parseFloat(t) : null,
    added: d || new Date().toISOString().slice(0,10),
  });
  saveWL(list);
  renderWatchlist();
}

updateWLBadge();

// ── consensus (跨策略叠加榜) ─────────────────────────────────────────────────
let _consensusData = null;

function renderConsensusEmpty() {
  document.getElementById('consensusPanel').innerHTML = `
    <div class="empty-state">
      <div class="icon">⭐</div>
      <p>点击右上角「跑叠加榜」</p>
      <small>同时跑 7 个策略，按入选次数排序<br/>5次以上=高确信、3-4次=中等、1-2次=单一信号</small>
    </div>`;
}

async function runConsensus() {
  const btn = document.getElementById('runConsensusBtn');
  btn.disabled = true;
  setStatus('running', '叠加榜计算中…'); setProgress(2);
  document.getElementById('consensusPanel').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:60px;color:var(--text3)">
      <div class="spinner"></div><span>正在跑 7 个策略，按当前股票池和区间筛选…</span>
    </div>`;
  try {
    const body = {
      universe: document.getElementById('universe').value,
      sector_filter: document.getElementById('sector_filter').value,
      months: isCustom?6:activePreset,
      top_n: 10,
    };
    const r = await fetch('/api/consensus', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    const d = await r.json();
    if (d.error) {
      document.getElementById('consensusPanel').innerHTML = `<div style="color:var(--red);padding:20px">${esc(d.error)}</div>`;
      btn.disabled = false; return;
    }
  } catch(e) {
    document.getElementById('consensusPanel').innerHTML = `<div style="color:var(--red);padding:20px">${esc(e.message)}</div>`;
    btn.disabled = false;
  }
}

const STRAT_SHORT = {
  momentum:         '动量',
  momentum_quality: '质量动量',
  low_vol:          '低波',
  dual_momentum:    '双动量',
  multifactor:      '多因子',
  high52w:          '52W新高',
  connors_rsi:      'Connors',
};

function renderConsensus(data) {
  _consensusData = data;
  document.getElementById('runConsensusBtn').disabled = false;
  setStatus('done', `叠加榜完成 · ${data.rows.length} 只候选`);
  setProgress(100);
  setTimeout(()=>setProgress(0), 1500);

  const rows = data.rows;
  if (!rows.length) {
    document.getElementById('consensusPanel').innerHTML = `<div class="empty-state">没有任何股票被多个策略选中</div>`;
    return;
  }

  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div>
        <h3 style="margin:0;font-size:14px">高确信度叠加榜 · ${data.strategies.length} 个策略</h3>
        <p style="margin:3px 0 0;font-size:11px;color:var(--text3)">每个策略选前 ${data.top_n} 名，按重叠出现次数排序</p>
      </div>
      <div style="display:flex;gap:6px;font-size:11px">
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#16a34a;border-radius:2px"></span>≥5 高确信</span>
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#d97706;border-radius:2px"></span>3-4 中</span>
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#9ca3af;border-radius:2px"></span>1-2 单</span>
      </div>
    </div>
    <div class="consensus-grid">`;

  rows.forEach(r => {
    const tier = r.count >= 5 ? 'tier-1' : r.count >= 3 ? 'tier-2' : 'tier-3';
    const strats = Object.entries(r.ranks).map(([k,v])=>
      `<span class="cs-strat-tag">${esc(STRAT_SHORT[k]||k)} <b>#${v}</b></span>`
    ).join('');
    html += `
      <div class="cs-card ${tier}">
        <div class="cs-head">
          <div>
            <div class="cs-tk" onclick="loadDetail('${esc(r.ticker)}')">${esc(r.ticker)}</div>
            <div class="cs-name" title="${esc(r.name||'')}">${esc(r.name||'')}</div>
          </div>
          <div class="cs-badge">${r.count}<span style="font-size:10px;font-weight:600">/ ${data.strategies.length}</span></div>
        </div>
        <div class="cs-strats">${strats}</div>
        <div class="cs-meta">
          <span>板块 ${esc(r.sector||'—')}</span>
          <span>平均排名 #${r.avg_rank}</span>
        </div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('consensusPanel').innerHTML = html;
}

// SSE: register consensus_done — re-hook into connectSSE
function _hookConsensusSSE() {
  if (!evtSource) return;
  evtSource.addEventListener('consensus_done', e => {
    try { renderConsensus(JSON.parse(e.data)); } catch(_){}
  });
}
setTimeout(_hookConsensusSSE, 500);
setTimeout(loadSettings, 100);

// ── position sizer (used inside detail panel) ────────────────────────────────
function computeSize(ticker) {
  const acct = parseFloat(document.getElementById('sizerAcct')?.value || 100000);
  const risk = parseFloat(document.getElementById('sizerRisk')?.value || 1);
  const row = allRows.find(r=>r.ticker===ticker);
  if (!row || row.price==null || row.stop==null) return;
  const riskUSD = acct * risk / 100;
  const perShareRisk = row.price - row.stop;
  if (perShareRisk <= 0) return;
  const shares = Math.floor(riskUSD / perShareRisk);
  const positionUSD = shares * row.price;
  const positionPct = (positionUSD / acct * 100).toFixed(1);
  document.getElementById('sizerOut').innerHTML =
    `<span>${shares} 股 ≈ $${positionUSD.toLocaleString(undefined,{maximumFractionDigits:0})} (${positionPct}% 账户)</span><b>${shares}</b>`;
}

// ── add-to-watchlist from detail panel ────────────────────────────────────────
function addCurrentToWatchlist() {
  const tk = document.getElementById('dTicker')?.textContent;
  if (!tk || tk === '—') return;
  const row = allRows.find(r=>r.ticker===tk);
  if (!row) return;
  if (row.price == null) { alert('当前价不可用'); return; }
  addToWatchlist(row.ticker, row.name, row.sector, row.price, row.stop, row.target);
}
